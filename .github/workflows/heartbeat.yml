name: 24/7 Cloud Heartbeat & Live Deals Publisher

on:
  schedule:
    # Run every 10 minutes to maintain 24/7 cloud uptime and check publishing windows
    - cron: '*/10 * * * *'
    # Additional precision crons near Dubai Golden Hours (06:00, 10:00, 14:00, 17:00 UTC)
    - cron: '50 5,9,13,16 * * *'
    - cron: '0 6,10,14,17 * * *'
    - cron: '10 6,10,14,17 * * *'
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force publish wave regardless of window'
        required: false
        default: 'false'
        type: boolean

jobs:
  heartbeat_and_publish:
    name: Keep Alive & Autonomous Deal Publishing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 1. Keep Render Concierge Awake (Healthcheck Ping)
        run: |
          echo "Pinging Render n8n healthz endpoint..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "https://n8n-service-kgny.onrender.com/healthz" || true)
          echo "Render Healthcheck HTTP Status: $HTTP_CODE"

      - name: 1.1 Keep WhatsHide Supabase Database Awake (Healthcheck RPC)
        run: |
          echo "Pinging Supabase WhatsHide-Licensing RPC..."
          SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxemh4ampocHVnd2hvaHVobGhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MDA2MDcsImV4cCI6MjEwMDk3NjYwN30.9VBeRDqohynd8de6nW4bY1Waq5ePOroggog_ZO2RWfI"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 30 -X POST \
            -H "apikey: $SUPA_KEY" \
            -H "Authorization: Bearer $SUPA_KEY" \
            -H "Content-Type: application/json" \
            -d "{}" \
            "https://dqzhxjjhpugwhohuhlhd.supabase.co/rest/v1/rpc/licensing_healthcheck" || true)
          echo "Supabase RPC Healthcheck HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "404" ]; then
            echo "::warning::rpc/licensing_healthcheck returned 404 (supabase_hardening.sql pending on Supabase). Falling back temporarily..."
            FB_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 30 \
              -H "apikey: $SUPA_KEY" \
              -H "Authorization: Bearer $SUPA_KEY" \
              "https://dqzhxjjhpugwhohuhlhd.supabase.co/rest/v1/license_activations?select=license_key&limit=1" || true)
            echo "Supabase Legacy Fallback HTTP Status: $FB_CODE"
          fi

      - name: Set up Python for Live Deal Engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: 2. Autonomous Intelligent Deals Publisher
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE_PUBLISH: ${{ github.event.inputs.force_publish || 'false' }}
        run: |
          python publish_fresh_wave_now.py
