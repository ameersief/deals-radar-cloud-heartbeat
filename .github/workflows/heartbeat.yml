name: 24/7 Cloud Heartbeat & Deals Trigger

on:
  schedule:
    # Run every 10 minutes to keep Render alive 24/7 without ever sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  heartbeat:
    name: Ping Render & Verify Engine
    runs-on: ubuntu-latest
    steps:
      - name: 1. Keep Render Awake (Healthcheck Ping)
        run: |
          echo "Pinging Render n8n healthz endpoint..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "https://n8n-service-kgny.onrender.com/healthz" || true)
          echo "Render Healthcheck HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Wake-up ping sent (container might be spinning up)."
          else
            echo "Render container is alive and healthy!"
          fi

      - name: 2. Scheduled Deals Publisher Trigger (Dubai Daytime Golden Hours)
        run: |
          CURRENT_HOUR=$(date -u +"%H")
          CURRENT_MIN=$(date -u +"%M")
          echo "Current UTC Time: $CURRENT_HOUR:$CURRENT_MIN"
          
          # Dubai Daytime Golden Hours (GST = UTC+4):
          # • 06:00 UTC = 10:00 AM Dubai (الصباح)
          # • 10:00 UTC = 02:00 PM Dubai (استراحة الغداء)
          # • 14:00 UTC = 06:00 PM Dubai (العصر ونهاية الدوام)
          # • 17:00 UTC = 09:00 PM Dubai (السهرة والتسوق المسائي)
          # NO publishing at dawn or late night (00:00 - 09:00 GST silent window)
          if [[ ("$CURRENT_HOUR" == "06" || "$CURRENT_HOUR" == "10" || "$CURRENT_HOUR" == "14" || "$CURRENT_HOUR" == "17") && "$CURRENT_MIN" -lt 15 ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Dubai Daytime Peak Hour Detected! Triggering Deals Publisher Webhook..."
            PUBLISH_RES=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -m 60 "https://n8n-service-kgny.onrender.com/webhook/publish-deal" || true)
            echo "Publisher response: $PUBLISH_RES"
          else
            echo "Heartbeat ping completed successfully (Interval keep-alive - Non-publishing hour)."
          fi
